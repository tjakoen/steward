<!DOCTYPE html>
<html lang="en" data-themes="baguette brioche">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STEWARD — Settings</title>
</head>
<body>
  <header class="app-header">
    <strong>STEWARD</strong>
    <nav>
      <a href="/">Home</a>
      <a href="/clients">Clients</a>
      <a href="/customers">Customers</a>
      <a href="/plans">Plans</a>
      <a href="/help">Help</a>
      <a href="/settings">Settings</a>
    </nav>
    <button type="button" data-toggle-scheme aria-label="Toggle light/dark">◐ Theme</button>
  </header>

  <main class="app-main">
    <h1>Settings</h1>

    <section>
      <h2>Appearance</h2>
      <p>Light / dark is a GRAIN token re-skin, persisted locally.</p>
      <button type="button" data-toggle-scheme>Toggle light / dark</button>
      <button type="button" data-cycle-theme>Cycle flavor</button>
      <span data-theme-name></span>
    </section>

    <section>
      <h2>Demo mode</h2>
      <p>Load fictional data into a separate demo database. Real data is untouched.</p>
      <button type="button" id="reset">Reset demo data</button>
      <button type="button" id="status">Show counts</button>
      <pre id="out"></pre>
    </section>
  </main>

  <script type="module">
    const out = document.getElementById('out');
    document.getElementById('reset').addEventListener('click', async () => {
      const r = await fetch('/demo/reset', { method: 'POST' });
      out.textContent = 'reset → ' + JSON.stringify(await r.json());
    });
    document.getElementById('status').addEventListener('click', async () => {
      const r = await fetch('/demo/status');
      out.textContent = JSON.stringify(await r.json(), null, 2);
    });
  </script>
</body>
</html>
