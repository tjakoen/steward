# Tag a version, get three binaries and the checksums the updater verifies against.
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# Run it by hand (Actions → release → Run workflow) and it is a REHEARSAL: everything
# below happens except the publish, and the three binaries plus SHA256SUMS come out as run
# artifacts instead of a release. That is how the Windows exe is obtained by someone with a
# Windows machine BEFORE a tag exists — find out whether it works before publishing it,
# not after. The publish step is guarded on `github.event_name == 'push'`, which says what
# it means; it used to be guarded only by the tag check failing, which is an accident.
#
# Two jobs, and only for one reason: `--windows-hide-console` and `--windows-icon` are
# refused by Bun unless the HOST is Windows ("only available when compiling on Windows").
# Everything else cross-compiles from the Linux runner, which is why there is no matrix.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # creating the release and uploading assets; nothing else

jobs:
  # The one target that needs its own runner. It produces the exe an operator
  # double-clicks: hidden console, real icon.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # No credentials in the environment, by design (0017). A published binary carries
      # none: the operator pastes them into Settings. This also removes the failure that
      # shipped v0.3.0 — four unset secrets substituted four empty strings and CI went
      # green over a release with Google entirely switched off.
      - name: Build the Windows binary
        run: bun run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: steward-windows-x64
          path: dist/steward-windows-x64.exe
          if-no-files-found: error

  release:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14      # the version the binaries were verified on

      - run: bun install --frozen-lockfile

      # The tag and package.json must agree. A binary that reports a version no release
      # carries makes every update check permanently wrong, in a way nobody notices until
      # someone actually needs an update — so this fails the build rather than the user.
      #
      # A manual run has no tag: GITHUB_REF_NAME is the branch, so this would compare
      # `main` to `0.3.0` and fail before the gate ever ran. Skipping it is what makes the
      # rehearsal rehearse anything.
      - name: The tag matches package.json
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(bun --print 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $PKG"
            exit 1
          fi

      # The full gate, on the same commit that becomes the release. `tsc` cannot see
      # markup, but it can see everything else, and the manifest's staleness test is the
      # one that stops a binary shipping without half its stylesheets.
      - run: bun run check
      - run: bun test

      # Before the build, so `scripts/build.ts` hashes it into SHA256SUMS along with the
      # two it compiles here. The updater refuses a binary the sums file does not name.
      - uses: actions/download-artifact@v4
        with:
          name: steward-windows-x64
          path: dist

      # Same as the Windows job: nothing secret in the environment, because nothing secret
      # goes into a binary any more (0017). A fork can build a release with no secrets
      # configured and get exactly what this repo gets.
      - name: Build the other two
        run: bun run build darwin linux

      # The manifest is checked in, and `bun run build` regenerates it. If that changed
      # anything, the commit being released does not describe the binary being released.
      - name: The checked-in manifest matches this commit
        run: git diff --exit-code -- build/assets.gen.ts

      # A rehearsal has to produce something a person can download and run, or it has only
      # proved that the compiler exits 0. The windows exe is already an artifact from the
      # job above; these are the other two and the checksums that verify all three.
      - name: Keep the binaries a rehearsal built
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: steward-rehearsal
          path: |
            dist/steward-darwin-arm64
            dist/steward-linux-x64
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "STEWARD $GITHUB_REF_NAME" \
            --generate-notes \
            dist/steward-windows-x64.exe \
            dist/steward-darwin-arm64 \
            dist/steward-linux-x64 \
            dist/SHA256SUMS
