# Tag a version, get three binaries and the checksums the updater verifies against.
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# Two jobs, and only for one reason: `--windows-hide-console` and `--windows-icon` are
# refused by Bun unless the HOST is Windows ("only available when compiling on Windows").
# Everything else cross-compiles from the Linux runner, which is why there is no matrix.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # creating the release and uploading assets; nothing else

jobs:
  # The one target that needs its own runner. It produces the exe an operator
  # double-clicks: hidden console, real icon.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build the Windows binary
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_PROJECT_NUMBER: ${{ secrets.GOOGLE_PROJECT_NUMBER }}
        run: bun run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: steward-windows-x64
          path: dist/steward-windows-x64.exe
          if-no-files-found: error

  release:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14      # the version the binaries were verified on

      - run: bun install --frozen-lockfile

      # The tag and package.json must agree. A binary that reports a version no release
      # carries makes every update check permanently wrong, in a way nobody notices until
      # someone actually needs an update — so this fails the build rather than the user.
      - name: The tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(bun --print 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $PKG"
            exit 1
          fi

      # The full gate, on the same commit that becomes the release. `tsc` cannot see
      # markup, but it can see everything else, and the manifest's staleness test is the
      # one that stops a binary shipping without half its stylesheets.
      - run: bun run check
      - run: bun test

      # Before the build, so `scripts/build.ts` hashes it into SHA256SUMS along with the
      # two it compiles here. The updater refuses a binary the sums file does not name.
      - uses: actions/download-artifact@v4
        with:
          name: steward-windows-x64
          path: dist

      - name: Build the other two
        env:
          # Baked into the binary — see scripts/build.ts and config.ts for why an
          # installed-app client secret travels this way. Unset secrets yield a working
          # binary with Drive switched off, so a fork's release still builds.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_PROJECT_NUMBER: ${{ secrets.GOOGLE_PROJECT_NUMBER }}
        run: bun run build darwin linux

      # The manifest is checked in, and `bun run build` regenerates it. If that changed
      # anything, the commit being released does not describe the binary being released.
      - name: The checked-in manifest matches this commit
        run: git diff --exit-code -- build/assets.gen.ts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "STEWARD $GITHUB_REF_NAME" \
            --generate-notes \
            dist/steward-windows-x64.exe \
            dist/steward-darwin-arm64 \
            dist/steward-linux-x64 \
            dist/SHA256SUMS
