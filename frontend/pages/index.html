<!DOCTYPE html>
<html lang="en" data-themes="baguette brioche">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STEWARD</title>
</head>
<body>
  <header class="app-header">
    <strong>STEWARD</strong>
    <nav>
      <a href="/">Home</a>
      <a href="/plans">Plans</a>
      <a href="/help">Help</a>
      <a href="/settings">Settings</a>
    </nav>
    <button type="button" data-toggle-scheme aria-label="Toggle light/dark">◐ Theme</button>
  </header>

  <main class="app-main">
    <h1>STEWARD</h1>
    <p>AI-first admin cockpit — task-ticket CRM with branded document generation. Foundation build.</p>

    <section>
      <h2>Proof of life</h2>
      <p>Sends a real Intent through the single door. The reasoner performs an audited SQLite write and streams a render op back over SSE.</p>
      <button type="button" id="run-demo">Run demo intent</button>
      <div id="reflection" data-surface="reflection" class="log" aria-live="polite"></div>
    </section>
  </main>

  <script type="module">
    const session = crypto.randomUUID();
    const log = document.getElementById('reflection');
    const line = (t) => { const p = document.createElement('p'); p.textContent = t; log.prepend(p); };

    const es = new EventSource('/stream?session=' + session);
    es.addEventListener('op', (e) => {
      try { const op = JSON.parse(e.data); if (op.text) line(op.text); }
      catch { /* ignore non-JSON frames */ }
    });

    document.getElementById('run-demo').addEventListener('click', async () => {
      const res = await fetch('/intent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session, screen: 'home', surface: 'screen', action: 'demo.run', payload: {} }),
      });
      line('intent sent → ' + res.status);
    });
  </script>
</body>
</html>
